input {
  beats {
    port => 5044
  }
}

filter {
  if [message] {
    json {
      source => "message"
      target => ""
      skip_on_invalid_json => true
    }
  }

  if [event_timestamp] {
    date {
      match => ["event_timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      remove_field => ["event_timestamp"]
    }
  }

  mutate {
    remove_field => ["agent", "ecs", "input", "log", "host", "@version", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "llm-interactions-%{+YYYY.MM.dd}"
  }
}